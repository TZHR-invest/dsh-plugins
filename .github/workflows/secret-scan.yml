name: secret-scan

# ⚠️ 本仓库是 **public**（TZHR-invest/dsh-plugins），而它管的恰恰是最容易夹带凭据的文件：
# 各插件 install.sh 会把 metaso / memory-recall / opencodex 的 key 写进 cordis.patch.yml 模板，
# 一次「把本机 patch 当模板拷进仓库」就会把三把 key 一起公开（2026-09-15 定案，历史已验证干净）。
# 所以每次 push / PR 都扫一遍；本地等价的跑法见 scripts/secret-scan.py 文档头。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 凭据形态 + 值级反查扫描
        # --secrets-file 指向的值清单只在本地存在（不进仓库）⇒ CI 里只跑形态扫描，
        # 值级反查由本地推送前补跑：python3 scripts/secret-scan.py --secrets-file ~/.meshdeck-secrets.md
        run: python3 scripts/secret-scan.py
